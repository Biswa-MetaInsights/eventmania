# Isolated NewFind core stack; no shared TalktoFile resources.
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
    - pgdata:/var/lib/postgresql/data
    - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER}
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - newfind
    command:
    - postgres
    - -c
    - shared_buffers=64MB
    - -c
    - max_connections=40
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --maxmemory
    - 48mb
    - --maxmemory-policy
    - noeviction
    volumes:
    - redisdata:/data
    mem_limit: 96m
    cpus: 0.2
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - newfind
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 3s
      retries: 5
  gateway:
    build: ./backend/gateway
    restart: unless-stopped
    ports:
    - 127.0.0.1:${NEWFIND_API_PORT:-18000}:8000
    depends_on:
      auth:
        condition: service_healthy
      user:
        condition: service_healthy
      event:
        condition: service_healthy
      ticketing:
        condition: service_healthy
    environment:
      APP_PORT: '8000'
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
    mem_limit: 192m
    cpus: 0.35
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - newfind
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
    - no-new-privileges:true
  auth:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user:
        condition: service_healthy
    environment:
      APP_PORT: '8001'
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://newfind-khaki.vercel.app}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/auth_db
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      TICKETING_SERVICE_URL: http://ticketing:8004
      DEBUG: 'false'
      KAFKA_ENABLED: 'false'
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY}
      USER_SERVICE_URL: http://user:8002
    mem_limit: 192m
    cpus: 0.35
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - newfind
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
    - no-new-privileges:true
  user:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: user
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_PORT: '8002'
      AUTH_SERVICE_URL: http://auth:8001
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/user_db
      REDIS_HOST: redis
      DEBUG: 'false'
      KAFKA_ENABLED: 'false'
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY}
    mem_limit: 192m
    cpus: 0.35
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - newfind
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
    - no-new-privileges:true
  event:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: event
    volumes:
    - newfind_places:/app/data
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_PORT: '8003'
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://newfind-khaki.vercel.app}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      USER_SERVICE_URL: http://user:8002
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/event_db
      REDIS_HOST: redis
      DEBUG: 'false'
      KAFKA_ENABLED: 'false'
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY}
      TICKETING_SERVICE_URL: http://ticketing:8004
    mem_limit: 192m
    cpus: 0.35
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - newfind
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
    - no-new-privileges:true
  ticketing:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: ticketing
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_PORT: '8004'
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      USER_SERVICE_URL: http://user:8002
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ticketing_db
      REDIS_HOST: redis
      DEBUG: 'false'
      KAFKA_ENABLED: 'false'
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY}
      EVENT_SERVICE_URL: http://event:8003
    mem_limit: 192m
    cpus: 0.35
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - newfind
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
    - no-new-privileges:true
volumes:
  newfind_places:
  pgdata: null
  redisdata: null
name: newfind
networks:
  newfind: {}
